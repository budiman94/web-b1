<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(120deg, #f0f4f8 0%, #c9e7ff 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 32px;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 24px;
            border: 4px solid #2196f3;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 2.2rem;
            color: #222;
        }
        h2 {
            margin: 0 0 24px 0;
            font-size: 1.2rem;
            color: #2196f3;
            font-weight: 400;
        }
        p {
            color: #444;
            font-size: 1.05rem;
            margin-bottom: 32px;
        }
        .social-links a {
            display: inline-block;
            margin: 0 10px;
            color: #2196f3;
            font-size: 1.5rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .social-links a:hover {
            color: #1769aa;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://ui-avatars.com/api/?name=Nama+Anda&background=2196f3&color=fff&size=256" alt="Foto Profil" class="profile-img">
        <h1>Nama Anda</h1>
        <h2>Profesi / Keahlian</h2>
        <p>Selamat datang di website profil pribadi saya. Saya adalah seorang profesional di bidang [profesi/keahlian], berpengalaman dalam [bidang/industri]. Saya antusias berbagi pengetahuan dan membangun koneksi baru.</p>
        <div class="social-links">
            <a href="#" title="LinkedIn"><span>🔗</span></a>
            <a href="#" title="GitHub"><span>💻</span></a>
            <a href="#" title="Email"><span>✉️</span></a>
        </div>
    </div>
</body>
</html>
